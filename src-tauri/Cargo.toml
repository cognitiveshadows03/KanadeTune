[package]
name = "kanadetune"
version = "0.3.0"
description = "KanadeTune — a light, cute desktop player for YouTube Music"
authors = ["cognitiveshadows"]
license = "MIT"
repository = "https://github.com/cognitiveshadows03/KanadeTune"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
